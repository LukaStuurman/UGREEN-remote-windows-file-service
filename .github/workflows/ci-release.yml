name: CI and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Run API tests
        working-directory: server
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        working-directory: server
        run: python -m py_compile app.py tests/test_app.py

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate NAS Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          export DATA_PATH=/tmp/Techbase
          export UGREEN_DRIVE_REF=main
          export PUID=1000
          export PGID=10
          config="$(docker compose -f docker-compose.ugreen.yaml config --format json)"
          printf '%s' "$config" | jq '{volumes: .services["ugreen-remote-drive"].volumes, techbaseHostPath: .services["ugreen-remote-drive"].environment.TECHBASE_HOST_PATH}'
          printf '%s' "$config" | jq -e '
            (.services["ugreen-remote-drive"].volumes | length == 1)
          ' >/dev/null
          printf '%s' "$config" | jq -e '
            (.services["ugreen-remote-drive"].volumes[0].source == "/tmp/Techbase") and
            (.services["ugreen-remote-drive"].volumes[0].type == "bind") and
            (.services["ugreen-remote-drive"].volumes[0].target == "/data") and
            (.services["ugreen-remote-drive"].environment.TECHBASE_HOST_PATH == "/tmp/Techbase")
          ' >/dev/null
          # Compose's JSON normalizer writes the explicit false option as an empty bind object.
          grep -Fq 'create_host_path: false' docker-compose.ugreen.yaml
      - name: Build and smoke-test isolated container
        shell: bash
        run: |
          set -euo pipefail
          image='ugreen-remote-drive:ci'
          container='ugreen-remote-drive-smoke'
          share="$RUNNER_TEMP/Techbase"
          mkdir -p "$share"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build --tag "$image" ./server
          docker run --detach \
            --name "$container" \
            --user "$(id -u):$(id -g)" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 64 \
            --memory 256m \
            --publish 127.0.0.1:18765:8080 \
            --env "TECHBASE_HOST_PATH=$share" \
            --volume "$share:/data:rw" \
            "$image"

          health_url='http://127.0.0.1:18765/api/v1/health'
          list_url='http://127.0.0.1:18765/api/v1/list'
          healthy=0
          for _ in $(seq 1 30); do
            if curl --fail --silent "$health_url" >/dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done
          test "$healthy" = 1

          forbidden="$(curl --silent --output /dev/null --write-out '%{http_code}' "$list_url")"
          test "$forbidden" = '403'
          curl --fail --silent --show-error \
            --header 'X-UGREEN-Remote-Drive: 1' \
            "$list_url" | python -c 'import json, sys; assert json.load(sys.stdin) == []'

  wireguard-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Test private WireGuard configuration and firewall policy
        working-directory: direct-wireguard
        run: python -m unittest discover -s tests -v
      - name: Validate direct-only Compose exposure
        shell: bash
        run: |
          set -euo pipefail
          export NAS_ADDRESS=192.168.50.10 WG_ENDPOINT=vpn.example.com WG_PORT=51820
          config="$(docker compose -f docker-compose.wireguard.yaml config --format json)"
          printf '%s' "$config" | jq -e '
            .services["techbase-wireguard"] |
            (.ports | length == 1) and
            (.ports[0].protocol == "udp") and (.ports[0].target == 51820) and
            (.volumes | length == 1) and (.volumes[0].type == "volume") and
            (.volumes[0].target == "/config") and (.read_only == true) and
            (.cap_drop == ["ALL"]) and
            (.cap_add | sort == ["NET_ADMIN", "NET_BIND_SERVICE"]) and
            (.network_mode != "host") and (.privileged != true)
          ' >/dev/null
      - name: Prepare TUN on disposable runner only
        shell: bash
        run: |
          if [ ! -c /dev/net/tun ]; then
            sudo modprobe tun || true
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
      - name: Verify encrypted SMB round trip and blocked forwarding in isolated containers
        run: bash direct-wireguard/tests/smoke.sh

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Restore Windows client
        run: dotnet restore client/UGREENRemoteDrive.sln
      - name: Build Windows client
        run: dotnet build client/UGREENRemoteDrive.sln -c Release --no-restore
      - name: Run Windows client tests
        run: dotnet test client/UGREENRemoteDrive.sln -c Release --no-build
      - name: Install isolated desktop-helper test dependencies
        working-directory: client/browser-tests
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test saved-login preference and delayed NAS desktop activation
        working-directory: client/browser-tests
        run: npm test
      - name: Publish and package Windows client
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'UGREENRemoteDrive'
          $archive = Join-Path $env:RUNNER_TEMP 'UGREENRemoteDrive-win-x64.zip'
          dotnet restore client/UGREENRemoteDrive/UGREENRemoteDrive.csproj -r win-x64
          dotnet publish client/UGREENRemoteDrive/UGREENRemoteDrive.csproj `
            -c Release -r win-x64 --self-contained true --no-restore --output $publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false
          $exe = Join-Path $publish 'UGREENRemoteDrive.exe'
          $releaseExe = Join-Path $env:RUNNER_TEMP 'UGREENRemoteDrive.exe'
          Copy-Item $exe -Destination $releaseExe
          Copy-Item README.md -Destination (Join-Path $publish 'README.md')
          Compress-Archive -Path (Join-Path $publish '*') -DestinationPath $archive
          $exeHash = (Get-FileHash $releaseExe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$exeHash  UGREENRemoteDrive.exe" |
            Set-Content -NoNewline -Encoding ascii "$releaseExe.sha256"
          $zipHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  UGREENRemoteDrive-win-x64.zip" |
            Set-Content -NoNewline -Encoding ascii "$archive.sha256"
      - name: Package direct WireGuard Docker project without secrets
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'UGREENDirectWireGuard'
          New-Item -ItemType Directory -Path (Join-Path $bundle 'direct-wireguard') -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $bundle 'docs') -Force | Out-Null
          Copy-Item docker-compose.wireguard.yaml, wireguard.env.example -Destination $bundle
          Copy-Item direct-wireguard/Dockerfile, direct-wireguard/app.py -Destination (Join-Path $bundle 'direct-wireguard')
          Copy-Item docs/direct-wireguard.md -Destination (Join-Path $bundle 'docs')
          $archive = Join-Path $env:RUNNER_TEMP 'UGREENDirectWireGuard-docker.zip'
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  UGREENDirectWireGuard-docker.zip" | Set-Content -NoNewline -Encoding ascii "$archive.sha256"
      - name: Build installer with bundled official Dokany
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $arguments = @{
            PublishDirectory = Join-Path $env:RUNNER_TEMP 'UGREENRemoteDrive'
            OutputDirectory = $env:RUNNER_TEMP
          }
          if ($env:RELEASE_REF.StartsWith('refs/tags/v')) {
            $arguments.Version = $env:RELEASE_REF_NAME.Substring(1)
          }
          ./installer/Build-Installer.ps1 @arguments
      - name: Test fresh install, existing Dokany, and uninstall on disposable runner
        shell: pwsh
        run: ./installer/Test-Installer.ps1 -Installer (Join-Path $env:RUNNER_TEMP 'UGREENRemoteDrive-Setup-win-x64.exe')
      - name: Collect installer diagnostic logs
        if: always()
        shell: pwsh
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP 'installer-diagnostics'
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'installer-smoke-*.log'), `
            'C:/ProgramData/UGREEN Remote Drive/InstallerLogs/*.log' `
            -File -ErrorAction SilentlyContinue | Copy-Item -Destination $diagnostics
      - name: Upload installer diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: installer-diagnostics
          path: ${{ runner.temp }}/installer-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload release files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: UGREENRemoteDrive-win-x64
          path: |
            ${{ runner.temp }}/UGREENRemoteDrive-Setup-win-x64.exe
            ${{ runner.temp }}/UGREENRemoteDrive-Setup-win-x64.exe.sha256
            ${{ runner.temp }}/UGREENRemoteDrive.exe
            ${{ runner.temp }}/UGREENRemoteDrive.exe.sha256
            ${{ runner.temp }}/UGREENRemoteDrive-win-x64.zip
            ${{ runner.temp }}/UGREENRemoteDrive-win-x64.zip.sha256
            ${{ runner.temp }}/UGREENDirectWireGuard-docker.zip
            ${{ runner.temp }}/UGREENDirectWireGuard-docker.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       contains(github.event.head_commit.message, '[release v'))
    needs:
      - server-tests
      - container-smoke
      - wireguard-smoke
      - windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows release files
        uses: actions/download-artifact@v8.0.1
        with:
          name: UGREENRemoteDrive-win-x64
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            tag_args=(--verify-tag)
            prerelease_args=()
            if [[ "$tag" == *-* ]]; then
              prerelease_args=(--prerelease)
            fi
          else
            tag="$(grep -oE '\[release v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\]' <<< "$RELEASE_COMMIT_MESSAGE" | tail -n1 | sed -E 's/^\[release (v[^]]+)\]$/\1/')"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo 'Release marker must look like [release vMAJOR.MINOR.PATCH[-preview.N]].' >&2
              exit 1
            fi
            prerelease_args=()
            if [[ "$tag" == *-* ]]; then
              prerelease_args=(--prerelease)
            fi
            tag_args=(--target "$GITHUB_SHA")
          fi

          gh release create "$tag" \
            dist/UGREENRemoteDrive-Setup-win-x64.exe \
            dist/UGREENRemoteDrive-Setup-win-x64.exe.sha256 \
            dist/UGREENRemoteDrive.exe \
            dist/UGREENRemoteDrive.exe.sha256 \
            dist/UGREENRemoteDrive-win-x64.zip \
            dist/UGREENRemoteDrive-win-x64.zip.sha256 \
            dist/UGREENDirectWireGuard-docker.zip \
            dist/UGREENDirectWireGuard-docker.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            "${tag_args[@]}" \
            "${prerelease_args[@]}" \
            --title "UGREEN Remote Drive $tag" \
            --generate-notes
