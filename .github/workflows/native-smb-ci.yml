name: Native SMB without Dokany

on:
  pull_request:
    branches: [main]
    paths:
      - 'native-smb/**'
      - '.github/workflows/native-smb-ci.yml'
      - 'embedded-tailscale/go.mod'
  push:
    branches: [main]
    tags: ['native-v*']
    paths:
      - 'native-smb/**'
      - '.github/workflows/native-smb-ci.yml'
      - 'embedded-tailscale/go.mod'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Test native SMB restrictions and authenticated peer resolution
        shell: pwsh
        run: dotnet test native-smb/Native.Tests/Native.Tests.csproj -c Release
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: embedded-tailscale/go.mod
          cache-dependency-path: embedded-tailscale/go.sum
      - name: Build standalone app, private tailscaled and signed Wintun installer
        shell: pwsh
        run: ./native-smb/Build-Native.ps1
      - name: Prove the new installer contains no Dokany
        shell: pwsh
        run: |
          $package = 'native-smb/output/app'
          if (!(Test-Path (Join-Path $package 'UGREENRemoteDrive.Native.exe'))) { throw 'Native SMB executable missing.' }
          foreach ($name in @('tailscale.exe','tailscaled.exe','wintun.dll')) {
            if (!(Test-Path (Join-Path $package "tailnet/$name"))) { throw "Missing private component $name" }
          }
          if (Get-ChildItem $package -Recurse -File | Where-Object { $_.Name -match '(?i)dokan' }) {
            throw 'Native SMB package unexpectedly contains Dokany.'
          }
      - name: Verify one portable EXE with embedded helpers and no installer
        shell: pwsh
        run: |
          $exe = 'native-smb/output/UGREENRemoteDrive-Portable.exe'
          if (!(Test-Path $exe)) { throw 'The portable EXE is missing.' }
          if ((Get-Item $exe).Length -lt 30000000) { throw 'The EXE may not contain all embedded Tailscale components.' }
          & $exe --portable-self-test
          if ($LASTEXITCODE -ne 0) { throw "Portable extraction and CLI smoke test failed: $LASTEXITCODE" }
          if (Get-ScheduledTask -TaskName UGREENRemoteDrivePortableTailnet -ErrorAction SilentlyContinue) {
            throw 'Portable smoke test must not install a scheduled task.'
          }
      - name: Start private Windows Tailscale daemon without a tailnet account
        shell: pwsh
        run: |
          $root = (Resolve-Path 'native-smb/output/app').Path
          ./native-smb/InstallTailnet.ps1 -AppRoot $root
          try {
            Start-Sleep -Seconds 4
            if (!(Get-ScheduledTask -TaskName UGREENRemoteDriveNativeTailnet)) { throw 'Private daemon task missing.' }
            $cli = Join-Path $root 'tailnet/tailscale.exe'
            $socket = '\\.\pipe\ProtectedPrefix\Administrators\UGREENRemoteDriveNative\tailscaled'
            $status = & $cli "--socket=$socket" status --json
            if ($LASTEXITCODE -ne 0) { throw "Private daemon not reachable: $LASTEXITCODE" }
            $parsed = $status | ConvertFrom-Json
            if (!$parsed.BackendState) { throw 'Private daemon status is malformed.' }
            Write-Host "Private daemon state: $($parsed.BackendState)."
          } finally {
            ./native-smb/InstallTailnet.ps1 -AppRoot $root -Remove
          }
      - name: Upload separate Native SMB preview files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: UGREENRemoteDrive-NativeSMB-preview
          path: |
            native-smb/output/UGREENRemoteDrive-NativeSMB-Setup-win-x64.exe
            native-smb/output/UGREENRemoteDrive-NativeSMB-Setup-win-x64.exe.sha256
            native-smb/output/UGREENRemoteDrive-NativeSMB-win-x64.zip
            native-smb/output/UGREENRemoteDrive-NativeSMB-win-x64.zip.sha256
            native-smb/output/UGREENRemoteDrive-Portable.exe
            native-smb/output/UGREENRemoteDrive-Portable.exe.sha256
          if-no-files-found: error
          retention-days: 7

  publish-native-preview:
    if: >
      startsWith(github.ref, 'refs/tags/native-v') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       contains(github.event.head_commit.message, '[release-native v'))
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: UGREENRemoteDrive-NativeSMB-preview
          path: dist
      - name: Publish a distinct GitHub preview after all Windows checks pass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/native-v* ]]; then
            tag="$GITHUB_REF_NAME"
            target=(--verify-tag)
          else
            version="$(grep -oE '\[release-native v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\]' <<< "$RELEASE_COMMIT_MESSAGE" | tail -n1 | sed -E 's/^\[release-native (v[^]]+)\]$/\1/')"
            if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Missing valid [release-native vMAJOR.MINOR.PATCH-preview.N] marker" >&2
              exit 1
            fi
            tag="native-$version"
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" \
            dist/UGREENRemoteDrive-NativeSMB-Setup-win-x64.exe \
            dist/UGREENRemoteDrive-NativeSMB-Setup-win-x64.exe.sha256 \
            dist/UGREENRemoteDrive-NativeSMB-win-x64.zip \
            dist/UGREENRemoteDrive-NativeSMB-win-x64.zip.sha256 \
            dist/UGREENRemoteDrive-Portable.exe \
            dist/UGREENRemoteDrive-Portable.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" "${target[@]}" --prerelease \
            --title "UGREEN Remote Drive Native SMB $tag" --generate-notes
